<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191018" />
      <stop offset="100%" stop-color="#0a0508" />
    </linearGradient>
    <linearGradient id="videoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79b0" />
      <stop offset="100%" stop-color="#ff2d75" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p4Grad)" stroke="#ff2d75" stroke-width="2" />
  
  <rect width="600" height="42" rx="16" fill="#130c12" />
  <circle cx="30" cy="21" r="6" fill="#ff2d75" />
  <circle cx="50" cy="21" r="6" fill="#ff79b0" />
  <circle cx="70" cy="21" r="6" fill="#4ade80" />
  <text x="300" y="26" fill="#f472b6" font-family="monospace" font-size="11" text-anchor="middle">pink-studio-vfx.stream</text>
  
  <!-- Video Player Layout -->
  <rect x="30" y="60" width="540" height="250" rx="12" fill="#180e16" stroke="#ff2d75" stroke-opacity="0.3" />
  
  <!-- Play button circle -->
  <circle cx="300" cy="180" r="42" fill="url(#videoPink)" filter="drop-shadow(0 0 16px rgba(255,45,117,0.7))" />
  <polygon points="292,165 318,180 292,195" fill="#ffffff" />
  
  <!-- Media info bar -->
  <rect x="30" y="325" width="540" height="35" rx="8" fill="#1a0f19" />
  <text x="50" y="347" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Creative Motion Reel 2026 // 4K 60FPS Showcase</text>
