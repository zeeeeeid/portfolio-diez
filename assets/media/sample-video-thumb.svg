<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vthumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24111d" />
      <stop offset="50%" stop-color="#120910" />
      <stop offset="100%" stop-color="#050204" />
    </linearGradient>
    <radialGradient id="pinkSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff2d75" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vthumbGrad)" />
  <circle cx="400" cy="225" r="280" fill="url(#pinkSpot)" />
  
  <!-- Cyber grid lines -->
  <g stroke="#ff2d75" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>
  
  <!-- Video badge -->
  <rect x="40" y="40" width="120" height="36" rx="18" fill="#ff2d75" />
  <text x="100" y="63" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">▶ 4K VIDEO</text>

  <!-- Big Glowing Play Button -->
  <circle cx="400" cy="225" r="60" fill="#11080e" stroke="#ff2d75" stroke-width="4" filter="drop-shadow(0 0 30px rgba(255,45,117,0.8))" />
  <polygon points="388,200 425,225 388,250" fill="#ff79b0" />

  <!-- Title & Subtitle -->
  <text x="400" y="330" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="1">PROJECT SHOWCASE & DEMO REEL</text>
  <text x="400" y="365" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Frontend Animations • React Components • Dynamic PHP Integrations</text>
  <text x="400" y="400" fill="#a1a1aa" font-family="monospace" font-size="13" text-anchor="middle">Click to Play Demo Simulation or Replace with Your Video File</text>
</svg>

