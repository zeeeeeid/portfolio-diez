<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191924" />
      <stop offset="100%" stop-color="#0e0e14" />
    </linearGradient>
    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d75" />
      <stop offset="100%" stop-color="#ff79b0" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p1Grad)" stroke="#ff2d75" stroke-width="2" />
  
  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#121218" />
  <circle cx="30" cy="21" r="6" fill="#ff2d75" />
  <circle cx="50" cy="21" r="6" fill="#ff79b0" />
  <circle cx="70" cy="21" r="6" fill="#4ade80" />
  <rect x="180" y="11" width="240" height="20" rx="10" fill="#20202c" />
  <text x="300" y="25" fill="#a1a1aa" font-family="monospace" font-size="11" text-anchor="middle">react-dashboard.pink.dev</text>
  
  <!-- Sidebar -->
  <rect x="15" y="55" width="120" height="310" rx="10" fill="#13131b" />
  <rect x="25" y="70" width="100" height="24" rx="6" fill="url(#accentPink)" />
  <rect x="25" y="105" width="70" height="12" rx="4" fill="#272738" />
  <rect x="25" y="130" width="85" height="12" rx="4" fill="#272738" />
  <rect x="25" y="155" width="60" height="12" rx="4" fill="#272738" />
  <rect x="25" y="180" width="80" height="12" rx="4" fill="#272738" />
  
  <!-- Main content area -->
  <!-- Top cards -->
  <rect x="150" y="55" width="135" height="75" rx="10" fill="#1b1b26" stroke="#ff2d75" stroke-opacity="0.3" />
  <text x="165" y="80" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="12">TOTAL USERS</text>
  <text x="165" y="112" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">84.2K</text>
  
  <rect x="295" y="55" width="135" height="75" rx="10" fill="#1b1b26" stroke="#ff2d75" stroke-opacity="0.3" />
  <text x="310" y="80" fill="#ff2d75" font-family="sans-serif" font-weight="bold" font-size="12">ENGAGEMENT</text>
  <text x="310" y="112" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">98.4%</text>

  <rect x="440" y="55" width="145" height="75" rx="10" fill="#1b1b26" stroke="#ff2d75" stroke-opacity="0.3" />
  <text x="455" y="80" fill="#4ade80" font-family="sans-serif" font-weight="bold" font-size="12">PERFORMANCE</text>
  <text x="455" y="112" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">100 / 100</text>
  
  <!-- Chart visual -->
  <rect x="150" y="145" width="435" height="220" rx="12" fill="#13131c" stroke="#ff2d75" stroke-opacity="0.2" />
  <text x="170" y="175" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Activity Waveform // Realtime Analytics</text>
  
  <!-- Wave Graph -->
  <path d="M 170 310 Q 220 230 260 260 T 360 210 T 450 270 T 560 190" fill="none" stroke="url(#accentPink)" stroke-width="4" />
  <!-- Area fill under graph -->
  <path d="M 170 310 Q 220 230 260 260 T 360 210 T 450 270 T 560 190 L 560 330 L 170 330 Z" fill="#ff2d75" fill-opacity="0.1" />
  
  <!-- Sparkle dots -->
  <circle cx="260" cy="260" r="5" fill="#ff79b0" />
  <circle cx="360" cy="210" r="6" fill="#ffffff" stroke="#ff2d75" stroke-width="2" />
  <circle cx="560" cy="190" r="5" fill="#ff2d75" />
</svg>

