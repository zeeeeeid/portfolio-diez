<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0c0c12" />
    </linearGradient>
    <linearGradient id="pinkButton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79b0" />
      <stop offset="100%" stop-color="#ff2d75" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p3Grad)" stroke="#ff2d75" stroke-width="2" />
  
  <rect width="600" height="42" rx="16" fill="#121218" />
  <circle cx="30" cy="21" r="6" fill="#ff2d75" />
  <circle cx="50" cy="21" r="6" fill="#ff79b0" />
  <circle cx="70" cy="21" r="6" fill="#22c55e" />
  <text x="300" y="26" fill="#a1a1aa" font-family="monospace" font-size="11" text-anchor="middle">kawaii-soundboard.fun</text>

  <!-- Title banner -->
  <text x="300" y="85" fill="#ff79b0" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">✨ SYNTHWAVE & CHIPPOP SOUNDPAD ✨</text>
  <text x="300" y="105" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Playful 8-Bit Beats • Web Audio Engine • Responsive Touch Pads</text>

  <!-- 4x3 Soundpad Grid -->
  <g transform="translate(65, 125)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="105" height="60" rx="10" fill="url(#pinkButton)" stroke="#ffffff" stroke-width="2" />
    <text x="52" y="35" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">💖 POP 01</text>

    <rect x="120" y="0" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="172" y="35" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">⚡ CHIME</text>

    <rect x="240" y="0" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="292" y="35" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🌸 BOUNCE</text>

    <rect x="360" y="0" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="412" y="35" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🎮 LASER</text>

    <!-- Row 2 -->
    <rect x="0" y="75" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="52" y="110" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">💫 GLITCH</text>

    <rect x="120" y="75" width="105" height="60" rx="10" fill="url(#pinkButton)" stroke="#ffffff" stroke-width="2" />
    <text x="172" y="110" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🐱 MEOW</text>

    <rect x="240" y="75" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="292" y="110" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🍩 SWEET</text>

    <rect x="360" y="75" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="412" y="110" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">⭐ SPARKLE</text>

    <!-- Row 3 -->
    <rect x="0" y="150" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="52" y="185" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🎈 BUBBLE</text>

    <rect x="120" y="150" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="172" y="185" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🏆 WIN</text>

    <rect x="240" y="150" width="105" height="60" rx="10" fill="url(#pinkButton)" stroke="#ffffff" stroke-width="2" />
    <text x="292" y="185" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🔮 MAGIC</text>

    <rect x="360" y="150" width="105" height="60" rx="10" fill="#20202e" stroke="#ff2d75" stroke-width="1.5" />
    <text x="412" y="185" fill="#ff79b0" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🎵 DRUM</text>
  </g>
</svg>

